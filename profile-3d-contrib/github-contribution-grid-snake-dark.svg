<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 170" width="100%" height="100%">
  <style>
    .grid-bg { fill: #0B1020; }
    .cell-empty { fill: #161B22; }
    .cell-c1 { fill: #0e4429; }
    .cell-c2 { fill: #006d32; }
    .cell-c3 { fill: #26a641; }
    .cell-c4 { fill: #39d353; }
    .snake-body { fill: #00F7FF; }
    .snake-head { fill: #7B2FF7; }
    @keyframes crawl {
      0% { transform: translateX(0); }
      50% { transform: translateX(180px); }
      100% { transform: translateX(0); }
    }
    .crawling-snake {
      animation: crawl 8s ease-in-out infinite;
    }
  </style>

