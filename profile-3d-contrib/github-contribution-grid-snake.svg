<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 170" width="100%" height="100%">
  <style>
    .grid-bg { fill: #ffffff; }
    .cell-empty { fill: #ebedf0; }
    .cell-c1 { fill: #9be9a8; }
    .cell-c2 { fill: #40c463; }
    .cell-c3 { fill: #30a14e; }
    .cell-c4 { fill: #216e39; }
    .snake-body { fill: #0078D4; }
    .snake-head { fill: #7B2FF7; }
    @keyframes crawl {
      0% { transform: translateX(0); }
      50% { transform: translateX(180px); }
      100% { transform: translateX(0); }
    }
    .crawling-snake {
      animation: crawl 8s ease-in-out infinite;
    }
  </style>

  <rect width="850" height="170" rx="10" class="grid-bg" stroke="#E2E8F0" stroke-width="1.5" />

