<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020" />
      <stop offset="50%" stop-color="#0E1528" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B2FF7" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="850" height="320" rx="12" fill="url(#bg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Grid lines -->
  <g opacity="0.15" stroke="#00F7FF" stroke-width="0.8">
    <line x1="50" y1="260" x2="800" y2="260" />
    <line x1="100" y1="210" x2="800" y2="210" />
    <line x1="150" y1="160" x2="800" y2="160" />
    <line x1="200" y1="110" x2="800" y2="110" />
  </g>

  <!-- Isometric 3D Columns Simulation -->
  <g transform="translate(60, 40)">
    <!-- Month labels -->
    <text x="30" y="240" fill="#64748B" font-family="'Segoe UI', Roboto, sans-serif" font-size="12">Jan</text>
    <text x="150" y="240" fill="#64748B" font-family="'Segoe UI', Roboto, sans-serif" font-size="12">Apr</text>
    <text x="280" y="240" fill="#64748B" font-family="'Segoe UI', Roboto, sans-serif" font-size="12">Jul</text>
    <text x="410" y="240" fill="#64748B" font-family="'Segoe UI', Roboto, sans-serif" font-size="12">Oct</text>
    <text x="540" y="240" fill="#64748B" font-family="'Segoe UI', Roboto, sans-serif" font-size="12">Dec</text>

    <!-- 3D Contribution Pillars -->
    <!-- Jan -->
    <path d="M 40 210 L 52 203 L 64 210 L 52 217 Z" fill="#38BDF8" opacity="0.9"/>
    <path d="M 40 210 L 40 225 L 52 232 L 52 217 Z" fill="#0284C7"/>
    <path d="M 64 210 L 64 225 L 52 232 L 52 217 Z" fill="#0369A1"/>

    <!-- Feb-Mar -->
    <path d="M 100 170 L 115 160 L 130 170 L 115 180 Z" fill="#00F7FF" filter="url(#glow)" />
    <path d="M 100 170 L 100 225 L 115 235 L 115 180 Z" fill="#0891B2"/>
    <path d="M 130 170 L 130 225 L 115 235 L 115 180 Z" fill="#0E7490"/>

    <!-- Apr-Jun -->
    <path d="M 220 130 L 235 120 L 250 130 L 235 140 Z" fill="#A855F7" filter="url(#glow)" />
    <path d="M 220 130 L 220 225 L 235 235 L 235 140 Z" fill="#7E22CE"/>
    <path d="M 250 130 L 250 225 L 235 235 L 235 140 Z" fill="#6B21A8"/>

    <!-- Jul-Sep -->
    <path d="M 340 100 L 355 90 L 370 100 L 355 110 Z" fill="#00F7FF" filter="url(#glow)"/>
    <path d="M 340 100 L 340 225 L 355 235 L 355 110 Z" fill="#0284C7"/>
    <path d="M 370 100 L 370 225 L 355 235 L 355 110 Z" fill="#0369A1"/>

    <!-- Oct-Nov -->
    <path d="M 460 140 L 475 130 L 490 140 L 475 150 Z" fill="#C084FC" />
    <path d="M 460 140 L 460 225 L 475 235 L 475 150 Z" fill="#7E22CE"/>
    <path d="M 490 140 L 490 225 L 475 235 L 475 150 Z" fill="#581C87"/>

    <!-- Dec -->
    <path d="M 580 80 L 595 70 L 610 80 L 595 90 Z" fill="#38BDF8" filter="url(#glow)"/>
    <path d="M 580 80 L 580 225 L 595 235 L 595 90 Z" fill="#0284C7"/>
    <path d="M 610 80 L 610 225 L 595 235 L 595 90 Z" fill="#0369A1"/>

    <!-- Title and Telemetry Overlay -->
    <text x="30" y="25" fill="#00F7FF" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" letter-spacing="1.5">3D CONTRIBUTION TELEMETRY</text>
    <text x="30" y="45" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12">Telemetry Node: dilipkumar892 // Automated isometric commit density projection</text>
  </g>
</svg>

